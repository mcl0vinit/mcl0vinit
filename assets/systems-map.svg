<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Systems map centered on Vilano Runtime</title>
  <desc id="desc">Animated map of systems work centered on Runtime, with governance, retrieval, execution, monitoring, protocol sandboxing, and operator tooling around it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111d" />
      <stop offset="100%" stop-color="#141f31" />
    </linearGradient>
    <linearGradient id="publicCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102031" />
      <stop offset="100%" stop-color="#172b40" />
    </linearGradient>
    <linearGradient id="privateCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161d2c" />
      <stop offset="100%" stop-color="#20283b" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .line { stroke: #66d1e8; stroke-width: 1.6; stroke-opacity: 0.38; fill: none; stroke-dasharray: 7 10; }
      .public { fill: url(#publicCard); stroke: #79d8ef; stroke-width: 1.5; }
      .private { fill: url(#privateCard); stroke: #46566f; stroke-width: 1.2; }
      .tagPublic { fill: #0d2331; stroke: #79d8ef; stroke-width: 1; }
      .tagPrivate { fill: #1a2230; stroke: #59687f; stroke-width: 1; }
      .label { fill: #f1f7fb; font-size: 21px; font-weight: 700; }
      .body { fill: #b8c8d8; font-size: 14px; }
      .muted { fill: #8ea6bf; font-size: 13px; }
    </style>
  </defs>

  <rect width="1280" height="620" fill="url(#bg)" />

  <g opacity="0.12">
    <path d="M0 88H1280M0 176H1280M0 264H1280M0 352H1280M0 440H1280M0 528H1280" stroke="#74d5eb" />
    <path d="M160 0V620M320 0V620M480 0V620M640 0V620M800 0V620M960 0V620M1120 0V620" stroke="#74d5eb" />
  </g>

  <text class="mono" x="66" y="62" font-size="18" fill="#7edff2" letter-spacing="3">SYSTEM MAP</text>
  <text class="sans" x="66" y="98" font-size="30" font-weight="700" fill="#f4fbff">Runtime in the middle, operator systems all the way out</text>

  <g class="line">
    <path d="M640 308 C560 238, 458 212, 356 180">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M640 308 C736 228, 848 196, 942 176">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="5.3s" repeatCount="indefinite" />
    </path>
    <path d="M640 308 C770 332, 882 384, 964 462">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="5.9s" repeatCount="indefinite" />
    </path>
    <path d="M640 308 C516 350, 398 404, 312 472">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="6.4s" repeatCount="indefinite" />
    </path>
    <path d="M640 308 C590 224, 590 152, 592 120">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="4.7s" repeatCount="indefinite" />
    </path>
    <path d="M640 308 C640 392, 642 470, 642 520">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="5.1s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(484 234)" filter="url(#glow)">
    <rect class="public" x="0" y="0" rx="24" width="312" height="148" />
    <rect class="tagPublic" x="22" y="20" rx="16" width="88" height="28" />
    <text class="mono" x="41" y="39" font-size="13" fill="#b8f6ff">PUBLIC</text>
    <text class="sans label" x="22" y="82">Vilano Runtime</text>
    <text class="sans body" x="22" y="110">deterministic replay · BEAM kernel · TS workers</text>
    <text class="sans body" x="22" y="132">services, supervision, signals, passivation, operator CLI</text>
  </g>

  <g transform="translate(202 126)">
    <rect class="private" x="0" y="0" rx="18" width="278" height="96" />
    <rect class="tagPrivate" x="18" y="16" rx="14" width="86" height="24" />
    <text class="mono" x="34" y="32" font-size="12" fill="#c7d3df">PRIVATE</text>
    <text class="sans label" x="18" y="60">Distributed Monitoring</text>
    <text class="sans body" x="18" y="82">typed services · schedulers · workers · Redis · Postgres</text>
  </g>

  <g transform="translate(842 122)">
    <rect class="private" x="0" y="0" rx="18" width="306" height="104" />
    <rect class="tagPrivate" x="18" y="16" rx="14" width="86" height="24" />
    <text class="mono" x="34" y="32" font-size="12" fill="#c7d3df">PRIVATE</text>
    <text class="sans label" x="18" y="60">Market Systems</text>
    <text class="sans body" x="18" y="82">Rust · live feeds · proxy pools · transaction construction</text>
  </g>

  <g transform="translate(860 418)">
    <rect class="private" x="0" y="0" rx="18" width="314" height="104" />
    <rect class="tagPrivate" x="18" y="16" rx="14" width="86" height="24" />
    <text class="mono" x="34" y="32" font-size="12" fill="#c7d3df">PRIVATE</text>
    <text class="sans label" x="18" y="60">Governance Layers</text>
    <text class="sans body" x="18" y="82">authority envelopes · escalation · ledger · policy rails</text>
  </g>

  <g transform="translate(148 430)">
    <rect class="private" x="0" y="0" rx="18" width="324" height="104" />
    <rect class="tagPrivate" x="18" y="16" rx="14" width="86" height="24" />
    <text class="mono" x="34" y="32" font-size="12" fill="#c7d3df">PRIVATE</text>
    <text class="sans label" x="18" y="60">Protocol Sandboxes</text>
    <text class="sans body" x="18" y="82">Go + V8 · browser surfaces · sensors · custom TLS/HTTP</text>
  </g>

  <g transform="translate(466 52)">
    <rect class="private" x="0" y="0" rx="18" width="352" height="92" />
    <text class="sans label" x="20" y="38">Retrieval + Agent Execution</text>
    <text class="sans body" x="20" y="60">code intelligence, task graphs, review loops, fan-out / fan-in</text>
    <text class="mono muted" x="20" y="79">focused agent systems</text>
  </g>

  <g transform="translate(522 506)">
    <rect class="public" x="0" y="0" rx="18" width="244" height="76" />
    <text class="sans label" x="20" y="34">Rove</text>
    <text class="sans body" x="20" y="56">Fly devboxes · sync · profiles · tmux offload</text>
  </g>

  <g>
    <circle cx="640" cy="308" r="7" fill="#8cf3ff">
      <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="356" cy="180" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="942" cy="176" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="964" cy="462" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="312" cy="472" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="592" cy="120" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="642" cy="520" r="5" fill="#8cf3ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
